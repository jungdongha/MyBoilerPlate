# Testing Guide — MyBoilerPlate
# Last Updated: 2026-04-15

meta:
  title: Testing Guide
  type: Convention
  scope: Testing standards and practices

framework:
  testing: JUnit 5
  language: Korean test descriptions (@DisplayName)
  strategy: Unit tests with mocks (Mockito)
  assertions: AssertJ

test_structure:
  style:
    required: "JUnit 5 — @Test, @DisplayName, @Nested, @ExtendWith(MockitoExtension.class)"
    hierarchy:
      class: 테스트 대상 클래스 (e.g., MemberServiceTest)
      nested: 테스트 대상 메서드 (@Nested)
      method: 기대 결과 (~한다, ~를 반환한다, ~예외를 던진다)

  example: |
    @ExtendWith(MockitoExtension.class)
    @DisplayName("MemberService")
    class MemberServiceTest {

        @Mock
        private MemberRepository memberRepository;

        @InjectMocks
        private MemberService memberService;

        @Nested
        @DisplayName("findById")
        class FindById {

            @Test
            @DisplayName("존재하는 회원 ID가 주어지면 회원을 반환한다")
            void returnsMemberWhenExists() {
                // given
                Member member = Member.builder()
                        .nickName("테스트유저")
                        .email("test@test.com")
                        .password("encoded")
                        .role(Role.USER)
                        .build();
                given(memberRepository.findById(1L)).willReturn(Optional.of(member));

                // when
                Member result = memberService.findById(1L);

                // then
                assertThat(result.getNickName()).isEqualTo("테스트유저");
            }

            @Test
            @DisplayName("존재하지 않는 ID가 주어지면 BaseException을 던진다")
            void throwsWhenNotFound() {
                // given
                given(memberRepository.findById(99L)).willReturn(Optional.empty());

                // when & then
                assertThatThrownBy(() -> memberService.findById(99L))
                        .isInstanceOf(BaseException.class);
            }
        }
    }

test_annotations:
  unit:
    annotation: "@ExtendWith(MockitoExtension.class)"
    use_for: Service 레이어 테스트
    composition:
      - "@ExtendWith(MockitoExtension.class)"
      - "@Mock — 의존성 모킹"
      - "@InjectMocks — 테스트 대상 클래스"

coding_patterns:
  given_when_then:
    rule: "항상 given / when / then 주석으로 구조화"
    example: |
      @Test
      @DisplayName("유효한 회원 저장 요청이 주어지면 저장된 회원을 반환한다")
      void saveMember() {
          // given
          Member member = Member.builder()...build();
          given(memberRepository.save(any())).willReturn(member);

          // when
          Member saved = memberService.create(request);

          // then
          assertThat(saved.getNickName()).isEqualTo("테스트유저");
      }

  assertions:
    use: "AssertJ (fluent style)"
    examples:
      - assertThat(result).isNotNull()
      - assertThat(result.getNickName()).isEqualTo("테스트유저")
      - assertThatThrownBy(() -> ...).isInstanceOf(BaseException.class)
    forbidden:
      - assertEquals(expected, actual)   # AssertJ 사용
      - assertNotNull(value)              # AssertJ 사용

file_naming:
  pattern: "{TargetClass}Test.java"
  examples:
    - MemberServiceTest.java
    - AuthServiceTest.java
    - MemberGetServiceTest.java

directory_structure:
  path: src/test/java/com/back/myboilerplate/
  layout: |
    domain/
      member/
        service/
          MemberServiceTest.java
          MemberGetServiceTest.java
      auth/
        service/
          AuthServiceTest.java
  rules:
    - 메인 패키지 구조 그대로 미러링
    - Service 레이어 테스트 위주
    - Controller 테스트 금지 (단위 테스트만)
    - Repository 테스트 금지 (DB mock 사용)

best_practices:
  - rule: 단위 테스트만
    description: Mockito로 의존성 모킹 — Spring Context 로딩 금지
  - rule: 테스트 격리
    description: 각 @Test 메서드는 독립적 — 공유 가변 상태 금지
  - rule: 명확한 테스트 의도
    description: Korean @DisplayName + @Nested 계층 구조
  - rule: AAA 패턴
    description: 항상 given / when / then 구조로 작성

forbidden:
  - "영어 테스트 이름 (반드시 한글 @DisplayName 사용)"
  - "JUnit 4 (@RunWith — JUnit 5 사용)"
  - "@Autowired 필드 주입 in tests"
  - "@SpringBootTest (단위 테스트만)"
  - "H2 / TestContainers (Repository는 Mock 처리)"
  - "Controller 레이어 테스트"
